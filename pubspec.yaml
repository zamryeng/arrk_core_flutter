name: arrk_core_flutter
description: >-
  Arrk's Flutter core: base classes and plumbing for the four-layer
  architecture — view models, views, repositories, responses, events,
  navigation, network, services, session, and DI wiring.
version: 0.1.0
homepage: https://github.com/doleasoft/arrk_core_flutter
publish_to: none

environment:
  sdk: ^3.8.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.9.0
  event_bus: ^2.0.1
  get_it: ^9.1.0
  go_router: ^17.0.0
  http_parser: ^4.1.2
  injectable: ^2.6.0
  logging: ^1.3.0
  mime: ^2.0.0
  provider: ^6.1.5
  rxdart: ^0.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
