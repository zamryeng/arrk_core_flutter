name: arrk_core_example
description: Minimal example app exercising the arrk_core_flutter public API.
publish_to: none
version: 0.1.1

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.8"

dependencies:
  flutter:
    sdk: flutter
  arrk_core_flutter:
    path: ../
  get_it: ^9.3.0
  go_router: ^18.1.4
  injectable: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.4
  injectable_generator: ^3.1.3

flutter:
  uses-material-design: true
