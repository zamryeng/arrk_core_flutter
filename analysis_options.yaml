include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  # The lints package is its own Dart package (analysis_server_plugin,
  # package:test). Analyzed in its own context by its tests; excluded here so
  # a root analyze does not resolve its deps or flag its intentional _bad
  # fixtures.
  exclude:
    - arrk_lints/**

linter:
  rules:
    - always_declare_return_types
    - avoid_relative_lib_imports
    - prefer_relative_imports
    - avoid_renaming_method_parameters
    - flutter_style_todos
    - prefer_is_empty
    - prefer_is_not_empty
    - prefer_single_quotes

formatter:
  page_width: 100
  trailing_commas: preserve
